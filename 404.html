<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page Not Found · 2BHK Rentals</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root { --navy:#0b2545; --gold:#c9a227; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; text-align:center;
      font-family:"Segoe UI",Roboto,Arial,system-ui,sans-serif; color:#1a2233;
      background:linear-gradient(135deg,#0b2545,#13315c); padding:24px;
    }
    .box { background:#fff; border-radius:20px; padding:48px 34px; max-width:460px; box-shadow:0 20px 50px rgba(0,0,0,.3); }
    .mark { display:inline-grid; place-items:center; width:64px; height:64px; border-radius:16px;
      background:linear-gradient(135deg,#13315c,#1b4079); color:var(--gold); font-family:Georgia,serif;
      font-weight:700; font-size:1.5rem; margin-bottom:18px; }
    h1 { font-family:Georgia,serif; font-size:3.4rem; margin:0; color:var(--navy); }
    p { color:#5b6577; margin:8px 0 26px; }
    a.btn { display:inline-block; text-decoration:none; background:var(--navy); color:#fff;
      padding:13px 26px; border-radius:999px; font-weight:600; transition:.25s; }
    a.btn:hover { background:#1b4079; }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark">2B</div>
    <h1>404</h1>
    <p>Sorry, this page doesn't exist. The listing you're looking for may have moved.</p>
    <a class="btn" href="/">Back to Home</a>
  </div>
</body>
</html>
